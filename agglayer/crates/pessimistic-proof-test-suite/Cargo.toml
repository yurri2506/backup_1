[package]
name = "pessimistic-proof-test-suite"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ppgen"
path = "src/bin/ppgen.rs"

[[bin]]
name = "convertor"
path = "src/bin/convertor.rs"

[dependencies]
agglayer-tries.workspace = true
agglayer-types = { workspace = true, features = ["testutils"] }
unified-bridge.workspace = true
pessimistic-proof = { path = "../pessimistic-proof" }
pessimistic-proof-core = { path = "../pessimistic-proof-core" }
agglayer-primitives.workspace = true
ecdsa-proof-lib = { path = "./aggchain-proof-ecdsa-example/lib/" }

base64.workspace = true
bincode.workspace = true
clap.workspace = true
ethers-signers.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sp1-sdk = { workspace = true }
sp1-core-machine.workspace = true
lazy_static.workspace = true
rayon = "1.10"
anyhow.workspace = true
rand.workspace = true
hex-literal = "0.4"
hex.workspace = true
tracing.workspace = true
uuid = { version = "1.13.1", features = ["v4", "fast-rng"] }
regex = "1.11"

[dev-dependencies]
insta.workspace = true
rstest.workspace = true
tracing.workspace = true
[[bin]]
name = "ppgen_sabv_lmtr"
path = "src/bin/ppgen_sabv_lmtr.rs"
[[bin]]
name = "ppgen_sabv_lmtr5"
path = "src/bin/ppgen_sabv_lmtr5.rs"
[[bin]]
name = "fraud_test_generator"
path = "src/bin/fraud_test_generator.rs"
